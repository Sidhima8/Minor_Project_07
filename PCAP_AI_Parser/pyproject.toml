[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap_ai_parser"
version = "0.2.0"
description = "PacketParser-AI: An Explainable, ML-Assisted Triage Layer for Network Forensics"
readme = "README.md"
authors = [
    { name = "PacketParser-AI Team" }
]
license = { text = "MIT" }
requires-python = ">=3.9"

dependencies = [
    "dpkt>=1.9.8",
    "pyshark>=0.6",
    "scapy>=2.5",
    "pandas>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "loguru>=0.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipython>=8.24"
]

[project.scripts]
pcap-parse = "pcap_ai_parser.cli:main"
pcap-triage = "pcap_ai_parser.payload_cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
